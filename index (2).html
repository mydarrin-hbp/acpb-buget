<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a3a5c">
<title>A&C PB Buget 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#1a3a5c;--c2:#2e6da4;--c3:#4fa3e0;
  --inc:#1a7a4a;--inc-bg:#e8f7f0;
  --exp:#b83232;--exp-bg:#fdf0f0;
  --bal:#7c4dbd;
  --warn:#e07b39;--warn-bg:#fff3e0;
  --bg:#f4f6f9;--surface:#fff;--border:#e2e6ea;
  --text:#1a2332;--text2:#5a6a7a;--text3:#8a9aaa;
  --shadow:0 1px 4px rgba(0,0,0,.08);
  --rad:10px;--rad-sm:6px
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.app{max-width:1300px;margin:0 auto;padding:16px}
.topbar{background:var(--c1);color:#fff;padding:13px 20px;border-radius:var(--rad) var(--rad) 0 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:17px;font-weight:600}
.topbar .sub{font-size:11px;opacity:.65;margin-top:1px}
.topbar-right{display:flex;gap:6px;flex-wrap:wrap}
.topbar-right button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 11px;border-radius:var(--rad-sm);font-size:12px;cursor:pointer}
.nav{background:var(--c2);display:flex;overflow-x:auto}
.nav button{background:none;border:none;color:rgba(255,255,255,.72);padding:10px 16px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nav button.active{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.12)}
.content{background:var(--surface);border-radius:0 0 var(--rad) var(--rad);padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.page{display:none;flex-direction:column;gap:14px}
.page.active{display:flex}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:14px;box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto;overflow-y:auto;border-radius:var(--rad-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 8px;background:var(--bg);position:sticky;top:0}
td{padding:6px 8px;border-bottom:1px solid var(--border)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
/* Culori status */
.s-platit{background:var(--inc-bg);color:var(--inc);border:1px solid #66bb6a}
.s-bugetat{background:#fff8e1;color:#7a5800;border:1px solid #ffd54f}
.s-partial{background:var(--warn-bg);color:#7a3800;border:1px solid #ffb74d}
.s-amanat{background:#f3e5f5;color:#6a1b9a;border:1px solid #ce93d8}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><h1>📊 A&C PB Buget 2026</h1></div>
  <nav class="nav"><button class="active">Dashboard</button></nav>
  <div class="content">
    <div id="page-articole" class="page active">
       <div class="tbl-wrap">
         <table>
           <thead><tr><th>Articol</th><th>Pers.</th><th>Status</th><th>Actiuni</th></tr></thead>
           <tbody id="art-body"></tbody>
         </table>
       </div>
    </div>
  </div>
</div>
<script>
// DATE ȘI CONFIGURARE
let date = {
  articole: [],
  tranzactii: [],
  categorii: [
    {id:1, nume:'Casă & Utilități', parent:null, culoare:'#2e6da4'},
    {id:2, nume:'Mâncare & Supermarket', parent:null, culoare:'#1a7a4a'},
    {id:3, nume:'Transport & Auto', parent:null, culoare:'#e07b39'},
    {id:4, nume:'Sănătate', parent:null, culoare:'#b83232'},
    {id:5, nume:'Educație & Cursuri', parent:null, culoare:'#7c4dbd'}
  ],
  setari: { userA: 'Andreea', userC: 'Cristian', apiAI: '' }
};

const LUNI = ['Ian','Feb','Mar','Apr','Mai','Iun','Iul','Aug','Sep','Oct','Nov','Dec'];

// FUNCȚIA DE RENDER TABEL (AICI ESTE CORECȚIA)
function renderArticole() {
  const tbody = document.getElementById('art-body');
  if(!tbody) return;
  tbody.innerHTML = '';

  date.articole.forEach((art, idx) => {
    let totalPlatit = art.luni.reduce((sum, l) => sum + (l.platit || 0), 0);
    let totalBugetat = art.luni.reduce((sum, l) => sum + (l.suma || 0), 0);
    let procent = totalBugetat > 0 ? Math.round((totalPlatit / totalBugetat) * 100) : 0;
    
    let tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div style="font-weight:600">${art.nume}</div>
        <div style="font-size:10px;color:var(--text3)">${getCatName(art.catId)}</div>
      </td>
      <td><span class="pill ${art.pers==='A'?'pill-a':art.pers==='C'?'pill-c':'pill-com'}">${art.pers}</span></td>
      <td><span class="pill ${art.tip==='venit'?'pill-inc':'pill-exp'}">${art.tip}</span></td>
      <td style="font-weight:600">${totalBugetat.toFixed(2)}</td>
      ${art.luni.map((l, lIdx) => {
        // AICI ESTE CORECȚIA SOLICITATĂ: eliminat ; după var(--exp)
        let sold = (l.suma || 0) - (l.platit || 0);
        let colorStyle = sold >= 0 ? 'var(--inc)' : 'var(--exp)';
        return `
          <td class="luna-cell">
            <div class="luna-val s-${l.status}" onclick="editLuna(${idx}, ${lIdx})">
              ${l.platit > 0 ? l.platit : l.suma}
            </div>
            <div style="font-size:9px;margin-top:2px;color:${colorStyle}">
              ${sold !== 0 ? (sold > 0 ? '+'+sold : sold) : ''}
            </div>
          </td>
        `;
      }).join('')}
      <td style="font-weight:700;color:var(--inc)">${totalPlatit.toFixed(2)}</td>
      <td>
        <div style="font-size:10px">${procent}%</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${procent}%;background:${procent>100?'var(--exp)':'var(--inc)'}"></div></div>
      </td>
      <td>
        <button class="btn-xs btn-outline" onclick="deleteArticol(${idx})">🗑️</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
  updateDashboard();
}

function getCatName(id) {
  let c = date.categorii.find(x => x.id == id);
  return c ? c.nume : 'Fără categorie';
}

// Navigare între pagini
function nav(pageId, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + pageId).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// Salvare date în LocalStorage
function saveData() {
  localStorage.setItem('acpb_buget_2026', JSON.stringify(date));
  showToast("Date salvate cu succes!");
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if(!t) return;
  t.innerText = msg;
  t.style.opacity = '1';
  t.style.background = 'var(--c1)';
  setTimeout(() => t.style.opacity = '0', 3000);
}
  // GESTIONARE TRANZACȚII
function addTranzactie() {
  const tip = document.getElementById('t-tip').value;
  const pers = document.getElementById('t-pers').value;
  const suma = parseFloat(document.getElementById('t-suma').value);
  const desc = document.getElementById('t-desc').value;
  const luna = parseInt(document.getElementById('t-luna').value);
  
  if(isNaN(suma) || suma <= 0) {
    alert("Te rugăm să introduci o sumă validă.");
    return;
  }

  const t = {
    id: Date.now(),
    tip, pers, suma, desc, luna,
    data: new Date().toISOString()
  };

  date.tranzactii.push(t);
  renderTranzactii();
  document.getElementById('t-suma').value = '';
  document.getElementById('t-desc').value = '';
  showToast("Tranzacție adăugată!");
}

function renderTranzactii() {
  const tbody = document.getElementById('t-body');
  if(!tbody) return;
  tbody.innerHTML = '';

  [...date.tranzactii].reverse().forEach((t, idx) => {
    let tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${LUNI[t.luna]}</td>
      <td><span class="pill ${t.pers==='A'?'pill-a':t.pers==='C'?'pill-c':'pill-com'}">${t.pers}</span></td>
      <td><span class="pill ${t.tip==='venit'?'pill-inc':'pill-exp'}">${t.tip}</span></td>
      <td>—</td>
      <td>${t.desc || 'Fără descriere'}</td>
      <td style="font-weight:600; color:${t.tip==='venit'?'var(--inc)':'var(--exp)'}">${t.suma.toFixed(2)} RON</td>
      <td><button class="btn-xs btn-outline" onclick="deleteT(${t.id})">🗑️</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// DASHBOARD & GRAFICE
let chartMain, chartPie;

function updateDashboard() {
  const ctxMain = document.getElementById('chartMain');
  if(!ctxMain) return;

  const venituriLuni = new Array(12).fill(0);
  const cheltuieliLuni = new Array(12).fill(0);

  date.tranzactii.forEach(t => {
    if(t.tip === 'venit') venituriLuni[t.luna] += t.suma;
    else cheltuieliLuni[t.luna] += t.suma;
  });

  if(chartMain) chartMain.destroy();
  chartMain = new Chart(ctxMain, {
    type: 'bar',
    data: {
      labels: LUNI,
      datasets: [
        { label: 'Venituri', data: venituriLuni, backgroundColor: '#1a7a4a' },
        { label: 'Cheltuieli', data: cheltuieliLuni, backgroundColor: '#b83232' }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

// EXPORT EXCEL
function exportExcel() {
  let rows = [["Denumire", "Persoana", "Tip", "Total Bugetat", "Total Platit"]];
  date.articole.forEach(a => {
    let tp = a.luni.reduce((s, l) => s + (l.platit || 0), 0);
    let tb = a.luni.reduce((s, l) => s + (l.suma || 0), 0);
    rows.push([a.nume, a.pers, a.tip, tb, tp]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, "Buget 2026");
  XLSX.writeFile(wb, "Buget_AC_2026.xlsx");
}

// INITIALIZARE
window.onload = () => {
  const saved = localStorage.getItem('acpb_buget_2026');
  if(saved) {
    const parsed = JSON.parse(saved);
    date = {...date, ...parsed};
  }
  renderArticole();
  renderTranzactii();
  // Ascunde login daca e cazul (logică simplificată)
  document.getElementById('login-screen').style.display = 'none'; 
};

function doLogout() {
  if(confirm("Sigur vrei să ieși?")) {
    location.reload();
  }
}
</script>

<div id="toast"></div>

<div id="m-edit-luna" class="modal-overlay" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" style="max-width:350px">
    <h3 id="mel-title">Editare lună</h3>
    <div class="form-row" style="grid-template-columns:1fr; gap:15px; margin-top:15px">
      <div>
        <label>Suma Bugetată</label>
        <input type="number" id="mel-buget" step="0.01">
      </div>
      <div>
        <label>Suma Plătită / Realizată</label>
        <input type="number" id="mel-platit" step="0.01">
      </div>
      <div>
        <label>Status</label>
        <select id="mel-status">
          <option value="bugetat">Bugetat</option>
          <option value="platit">Platit</option>
          <option value="partial">Partial</option>
          <option value="amanat">Amanat</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="saveLunaEdit()">Salvează Modificările</button>
    </div>
  </div>
</div>

</body>
</html>
